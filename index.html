<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vessel | Portfolio</title>

  <link rel="icon" type="image/png" href="images/Vessel.png">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-gray-900 text-slate-100 min-h-screen flex flex-col antialiased">
  <script src="script.js"></script>
  <!-- MP4 BACKGROUND -->
  <!-- WEBM BACKGROUND -->
  <video autoplay loop muted playsinline
    class="fixed top-0 left-0 w-full h-full object-cover -z-10 pointer-events-none opacity-80 blur-sm">
    <source src="rain.webm" type="video/webm">
    Your browser does not support the video tag.
  </video>


  <header class="relative w-full h-screen max-h-[500px] flex items-center justify-center bg-[#ff0000] px-4">
    <div id="section1-container"></div>
  </header>
  <div id="sectionSocials-container"></div>
  <div id="sectionDescription-container"></div>
  <div id="section2-container"></div>

  <!-- Footer -->
  <footer class="w-full py-8 text-center text-xs text-gray-600 border-t border-gray-900 bg-[#0d0f12]">
    &copy; 2026 Vessel. All rights reserved. :]
  </footer>



  <!-- ZOOM CONTAINER, LONG TEXT TO DISTINGUISH EVERYTHING                   -->
  <div id="lightbox"
    class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center hidden opacity-0 transition-opacity duration-300 z-[100] p-4">
    <button id="lightbox-close"
      class="absolute top-6 right-6 text-white text-3xl font-bold hover:text-red-500 transition-colors z-10">
      &times;
    </button>

    <div class="relative max-w-5xl max-h-[90vh] flex items-center justify-center">
      <!-- Image Display -->
      <img id="lightbox-img" src="" alt="Expanded View"
        class="max-w-full max-h-[85vh] rounded-xl shadow-2xl object-contain transform scale-95 transition-transform duration-300 hidden" />

      <!-- WebM / Video Display -->
      <video id="lightbox-video" autoplay loop muted playsinline controls
        class="max-w-full max-h-[85vh] rounded-xl shadow-2xl object-contain transform scale-95 transition-transform duration-300 hidden">
        <source id="lightbox-video-src" src="" type="video/webm">
      </video>
    </div>
  </div>

  <!-- Floating Music Player Widgdasssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssset -->
  <div id="music-player"
    class="fixed bottom-4 left-4 w-72 h-36 bg-gray-900/30 backdrop-blur-md border border-white/10 rounded-2xl flex flex-col p-3 transition-transform duration-700 ease-in-out transform -translate-x-[120%] z-50 shadow-2xl">

    <div id="song-title" class="text-sm font-semibold text-gray-200 text-center truncate w-full mb-2">
      Loading...
    </div>

    <!-- MIddle section -->
    <div class="flex items-center justify-between flex-1 px-1">

      <!-- CD image -->
      <div
        class="w-12 h-12 rounded-full border-2 border-gray-700 overflow-hidden relative flex items-center justify-center shadow-lg">
        <svg id="cd-image" class="w-full h-full text-gray-400 bg-gray-800 rounded-full p-1" viewBox="0 0 24 24"
          fill="currentColor">
          <path
            d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 14c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4z" />
        </svg>
        <!-- CD hole -->
        <div class="absolute w-3 h-3 bg-gray-900 rounded-full border border-gray-600"></div>
      </div>

      <!-- Playback Controls -->
      <div class="flex items-center gap-3">
        <!-- Prev Button -->
        <button id="prev-btn" class="text-gray-400 hover:text-white transition-colors">
          <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
            <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" />
          </svg>
        </button>

        <!-- Play/Pause Button -->
        <button id="play-btn"
          class="w-10 h-10 flex items-center justify-center rounded-full bg-indigo-500/80 hover:bg-indigo-500 text-white transition-all transform hover:scale-110">
          <svg id="play-icon" class="w-4 h-4 fill-current ml-1" viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z" />
          </svg>
          <svg id="pause-icon" class="w-4 h-4 fill-current hidden" viewBox="0 0 24 24">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
          </svg>
        </button>

        <!-- Next Button -->
        <button id="next-btn" class="text-gray-400 hover:text-white transition-colors">
          <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
            <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" />
          </svg>
        </button>
      </div>

      <!-- Song Time -->
      <div id="song-time" class="text-[10px] text-gray-400 font-mono w-12 text-right">
        0:00
      </div>
    </div>

    <!-- Music Progress Bar -->
    <div class="mt-3 w-full flex items-center">
      <input type="range" id="progress-bar" value="0" min="0" max="100"
        class="w-full h-1.5 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-indigo-500">
    </div>
  </div>

</body>

</html>
