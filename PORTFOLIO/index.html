<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vessel | Portfolio</title>
  
  <link rel="icon" type="image/png" href="images/Vessel.png">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-900 text-slate-100 min-h-screen flex flex-col antialiased">

  <!-- Fixed Background Video -->
  <video 
    autoplay 
    loop 
    muted 
    playsinline 
    class="fixed top-0 left-0 w-full h-full object-cover -z-10 pointer-events-none opacity-40"
  >
    <source src="rain.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>
  

  <header class="relative w-full h-screen min-h-[600px] flex items-center justify-center bg-[#ff0000] px-4">  
  <div id="section1-container"></div>
  </header>

  <div id="section2-container"></div>
  <div id="section3-container"></div>

  <!-- Footer -->
  <footer class="w-full py-8 text-center text-xs text-gray-600 border-t border-gray-900 bg-[#0d0f12]">
    &copy; 2026 Vessel. All rights reserved.
  </footer>

  <!-- External Script File -->
  <script src="script.js"></script>



<!-- ========================================== -->
<!-- LIGHTBOX MODAL CONTAINER                   -->
<!-- ========================================== -->
<div 
  id="lightbox" 
  class="fixed inset-0 z-50 hidden bg-black/90 backdrop-blur-md flex items-center justify-center p-4 transition-opacity duration-300 opacity-0 cursor-zoom-out"
>
  <!-- Close Button -->
  <button 
    id="lightbox-close" 
    class="absolute top-6 right-6 text-white/70 hover:text-white text-4xl font-light focus:outline-none z-10"
    aria-label="Close image preview"
  >
    &times;
  </button>

  <!-- Expanded Image Container -->
  <div class="relative max-w-5xl max-h-[90vh] w-full h-full flex items-center justify-center cursor-default">
    <img 
      id="lightbox-img" 
      src="" 
      alt="Expanded View" 
      class="max-w-full max-h-[85vh] object-contain rounded-lg shadow-2xl transition-transform duration-300 scale-95"
    />
  </div>
</div>

</body>
</html>
